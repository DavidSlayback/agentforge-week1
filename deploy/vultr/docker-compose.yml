services:
  mysql:
    restart: always
    image: mariadb:11.8.8@sha256:be1ef4fe5f14589325c08a41c76334097ce66c86264b75e1d28342c742782a61
    command: ['mariadbd', '--character-set-server=utf8mb4']
    volumes:
      - databasevolume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh', '--su-mysql', '--connect', '--innodb_initialized']
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 20s
      retries: 3

  openemr:
    restart: always
    image: openemr/openemr:latest@sha256:faf0b8386895ed7ab1891bb7c94012e50a91917113e3ae7111b5287d28546b38
    volumes:
      - logvolume01:/var/log
      - sitevolume:/var/www/localhost/htdocs/openemr/sites
      - ../../interface/modules/custom_modules/oe-module-agentforge:/var/www/localhost/htdocs/openemr/interface/modules/custom_modules/oe-module-agentforge
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASS: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      OE_USER: ${OE_USER:?OE_USER is required}
      OE_PASS: ${OE_PASSWORD:?OE_PASSWORD is required}
      AGENTFORGE_DEMO_SECRET: ${AGENTFORGE_DEMO_SECRET:-}
      AGENTFORGE_SERVICE_URL: ${AGENTFORGE_SERVICE_URL:?AGENTFORGE_SERVICE_URL is required}
      # oe-module-agentforge write endpoint (public/api.php): the synthetic-demo
      # issuer may write only for these OpenEMR patient uuids, attributed to
      # this OpenEMR user. Both are required for the W2 OpenEMR round-trip.
      AGENTFORGE_DEMO_WRITE_PATIENT_UUIDS: ${AGENTFORGE_DEMO_WRITE_PATIENT_UUIDS:?AGENTFORGE_DEMO_WRITE_PATIENT_UUIDS is required}
      AGENTFORGE_DEMO_ACTOR_USERNAME: ${AGENTFORGE_DEMO_ACTOR_USERNAME:?AGENTFORGE_DEMO_ACTOR_USERNAME is required}
      # Signs agentforge-w2 -> module requests. Only openemr and agentforge-w2
      # get it (never the Week 1 agentforge service); it must differ from
      # AGENTFORGE_DEMO_SECRET, which keeps signing context tokens.
      AGENTFORGE_MODULE_HMAC_SECRET: ${AGENTFORGE_MODULE_HMAC_SECRET:?AGENTFORGE_MODULE_HMAC_SECRET is required}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/bin/curl
        - --fail
        - --insecure
        - --location
        - --show-error
        - --silent
        - https://localhost/meta/health/readyz
      start_period: 3m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

  agentforge:
    restart: always
    # Week 1 is frozen (PLAN D8). This local tag was taken from the running W1
    # container (built from 84f232b, image sha256:fa4a6543a80a...). No build:
    # section, so no compose rebuild can replace W1 with W2 code.
    image: agentforge-w1:84f232b
    environment:
      PORT: 8787
      AGENTFORGE_FIXTURES: /app/docs/agentforge/fixtures/clinical-cases.json
      AGENTFORGE_DEMO_SECRET: ${AGENTFORGE_DEMO_SECRET:-}
      AGENTFORGE_SYNTHETIC_CONTEXT: ${AGENTFORGE_SYNTHETIC_CONTEXT:-true}
      AGENTFORGE_OPENEMR_MODE: ${AGENTFORGE_OPENEMR_MODE:-synthetic}
      AGENTFORGE_TRACE_PATH: ${AGENTFORGE_TRACE_PATH:-/data/traces.json}
      AGENTFORGE_PUBLIC_BASE_PATH: ${AGENTFORGE_PUBLIC_BASE_PATH:-/agentforge}
      AGENTFORGE_OPENEMR_BASE_URL: ${AGENTFORGE_OPENEMR_BASE_URL:-http://openemr}
      AGENTFORGE_OPENEMR_ACCESS_TOKEN: ${AGENTFORGE_OPENEMR_ACCESS_TOKEN:-}
      AGENTFORGE_OPENEMR_TOKEN_URL: ${AGENTFORGE_OPENEMR_TOKEN_URL:-https://openemr/oauth2/default/token}
      AGENTFORGE_OPENEMR_CLIENT_ID: ${AGENTFORGE_OPENEMR_CLIENT_ID:-}
      AGENTFORGE_OPENEMR_CLIENT_SECRET: ${AGENTFORGE_OPENEMR_CLIENT_SECRET:-}
      AGENTFORGE_OPENEMR_TOKEN_CACHE_PATH: ${AGENTFORGE_OPENEMR_TOKEN_CACHE_PATH:-/run/secrets/agentforge-openemr-token.json}
      AGENTFORGE_OPENEMR_TIMEOUT_MS: ${AGENTFORGE_OPENEMR_TIMEOUT_MS:-5000}
      AGENTFORGE_MODEL_ENDPOINT: ${AGENTFORGE_MODEL_ENDPOINT:-}
      AGENTFORGE_MODEL_PROTOCOL: ${AGENTFORGE_MODEL_PROTOCOL:-responses}
      AGENTFORGE_MODEL: ${AGENTFORGE_MODEL:-configured-model}
      AGENTFORGE_MODEL_API_KEY: ${AGENTFORGE_MODEL_API_KEY:-}
      AGENTFORGE_MODEL_SITE_URL: ${AGENTFORGE_MODEL_SITE_URL:-}
      AGENTFORGE_MODEL_SITE_NAME: ${AGENTFORGE_MODEL_SITE_NAME:-AgentForge}
      AGENTFORGE_MODEL_TIMEOUT_MS: ${AGENTFORGE_MODEL_TIMEOUT_MS:-8000}
      AGENTFORGE_PROVIDER_MODE: ${AGENTFORGE_PROVIDER_MODE:-qwen}
      AGENTFORGE_OPENROUTER_ENDPOINT: ${AGENTFORGE_OPENROUTER_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
      AGENTFORGE_OPENROUTER_API_KEY: ${AGENTFORGE_OPENROUTER_API_KEY:-}
      AGENTFORGE_OPENROUTER_MODEL: ${AGENTFORGE_OPENROUTER_MODEL:-}
      AGENTFORGE_OPENROUTER_SITE_URL: ${AGENTFORGE_OPENROUTER_SITE_URL:-}
      AGENTFORGE_OPENROUTER_SITE_NAME: ${AGENTFORGE_OPENROUTER_SITE_NAME:-AgentForge}
      AGENTFORGE_OPENROUTER_TIMEOUT_MS: ${AGENTFORGE_OPENROUTER_TIMEOUT_MS:-8000}
      AGENTFORGE_CONVERSATION_PROVIDER_MODE: ${AGENTFORGE_CONVERSATION_PROVIDER_MODE:-}
      AGENTFORGE_CONVERSATION_MODEL_ENDPOINT: ${AGENTFORGE_CONVERSATION_MODEL_ENDPOINT:-}
      AGENTFORGE_CONVERSATION_MODEL_PROTOCOL: ${AGENTFORGE_CONVERSATION_MODEL_PROTOCOL:-compatible}
      AGENTFORGE_CONVERSATION_MODEL: ${AGENTFORGE_CONVERSATION_MODEL:-}
      AGENTFORGE_CONVERSATION_MODEL_API_KEY: ${AGENTFORGE_CONVERSATION_MODEL_API_KEY:-}
      AGENTFORGE_CONVERSATION_MODEL_TIMEOUT_MS: ${AGENTFORGE_CONVERSATION_MODEL_TIMEOUT_MS:-5000}
      AGENTFORGE_CONVERSATION_OPENROUTER_ENDPOINT: ${AGENTFORGE_CONVERSATION_OPENROUTER_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
      AGENTFORGE_CONVERSATION_OPENROUTER_API_KEY: ${AGENTFORGE_CONVERSATION_OPENROUTER_API_KEY:-}
      AGENTFORGE_CONVERSATION_OPENROUTER_MODEL: ${AGENTFORGE_CONVERSATION_OPENROUTER_MODEL:-}
      AGENTFORGE_CONVERSATION_OPENROUTER_SITE_URL: ${AGENTFORGE_CONVERSATION_OPENROUTER_SITE_URL:-}
      AGENTFORGE_CONVERSATION_OPENROUTER_SITE_NAME: ${AGENTFORGE_CONVERSATION_OPENROUTER_SITE_NAME:-AgentForge}
      AGENTFORGE_CONVERSATION_OPENROUTER_TIMEOUT_MS: ${AGENTFORGE_CONVERSATION_OPENROUTER_TIMEOUT_MS:-5000}
      # Jev is an optional typed-evidence review lane. Keep it disabled in the
      # current synthetic release; these references only prepare server-side
      # secret injection for a separately authorized shadow run.
      AGENTFORGE_JEV_MODE: ${AGENTFORGE_JEV_MODE:-off}
      JEV_ENDPOINT: ${JEV_ENDPOINT:-https://www.jevai.org/api/v1/decisions}
      JEV_MODEL: ${JEV_MODEL:-typesafe-ai/jev}
      JEV_API_KEY: ${JEV_API_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_TIMEOUT_MS: ${LANGFUSE_TIMEOUT_MS:-3000}
      LANGFUSE_MAX_PENDING_EXPORTS: ${LANGFUSE_MAX_PENDING_EXPORTS:-16}
    volumes:
      - tracevolume:/data
      - ../../secrets/openemr-token.json:/run/secrets/agentforge-openemr-token.json
    networks:
      - default
      - agentforge-observability
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      openemr:
        condition: service_healthy

  # Week 2 surface. The chart stays the synthetic fixture (no OAuth token mount,
  # no persistent volume, no live provider secrets), but uploads and derived
  # facts are persisted in OpenEMR through oe-module-agentforge on the internal
  # network (AGENTFORGE_PERSISTENCE_MODE=openemr-module), only for the
  # allowlisted synthetic patients mapped below.
  agentforge-w2:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      PORT: 8788
      AGENTFORGE_FIXTURES: /app/docs/agentforge/fixtures/clinical-cases.json
      AGENTFORGE_DEMO_SECRET: ${AGENTFORGE_DEMO_SECRET:?AGENTFORGE_DEMO_SECRET is required}
      AGENTFORGE_SYNTHETIC_CONTEXT: "true"
      AGENTFORGE_OPENEMR_MODE: synthetic
      AGENTFORGE_PUBLIC_BASE_PATH: /agentforge-w2
      AGENTFORGE_PROVIDER_MODE: qwen
      # S6: the same model env W1's `agentforge` block already reads
      # (server.js buildProvider) -- without these, AGENTFORGE_PROVIDER_MODE
      # above has no endpoint/key to use and server.js silently falls back to
      # DeterministicProvider, so "qwen" was a label with nothing behind it.
      # The W2 answer composer (answerComposer.js) reuses this same
      # configured client for its own ResilientProvider; there is no separate
      # answer-model env. See deploy/vultr/README.md for the variable list.
      AGENTFORGE_MODEL_ENDPOINT: ${AGENTFORGE_MODEL_ENDPOINT:-}
      AGENTFORGE_MODEL_PROTOCOL: ${AGENTFORGE_MODEL_PROTOCOL:-responses}
      # W2-only overrides (PLAN): qwen3.8-max with thinking off answered the composer task in ~12 s vs ~25 s with it on (2026-09-24).
      AGENTFORGE_MODEL: ${AGENTFORGE_W2_MODEL:-${AGENTFORGE_MODEL:-configured-model}}
      AGENTFORGE_MODEL_API_KEY: ${AGENTFORGE_MODEL_API_KEY:-}
      AGENTFORGE_MODEL_SITE_URL: ${AGENTFORGE_MODEL_SITE_URL:-}
      AGENTFORGE_MODEL_SITE_NAME: ${AGENTFORGE_MODEL_SITE_NAME:-AgentForge}
      AGENTFORGE_MODEL_TIMEOUT_MS: ${AGENTFORGE_W2_MODEL_TIMEOUT_MS:-18000}
      AGENTFORGE_MODEL_ENABLE_THINKING: ${AGENTFORGE_W2_MODEL_ENABLE_THINKING:-false}
      # F6 review fix: per-scan-request deadline (source OCR retry + answer
      # composer provider call share one AbortSignal against this budget).
      AGENTFORGE_SCAN_DEADLINE_MS: ${AGENTFORGE_SCAN_DEADLINE_MS:-25000}
      AGENTFORGE_RAG_PROVIDER: gemini-hybrid
      # Reranker seam (owner decision 2026-09-24): the Gemini free-tier key
      # above exhausts itself on the listwise rerank alone (20 requests/day,
      # 5/min), so W2 keeps Gemini embeddings for dense retrieval but reranks
      # with Qwen -- reusing the same AGENTFORGE_MODEL_ENDPOINT/
      # AGENTFORGE_MODEL_API_KEY already set for the synthesis lane above, no
      # separate secret. See reranker.js and deploy/vultr/README.md.
      AGENTFORGE_RERANK_PROVIDER: ${AGENTFORGE_RERANK_PROVIDER:-qwen}
      AGENTFORGE_RERANK_MODEL: ${AGENTFORGE_RERANK_MODEL:-qwen3.8-flash}
      AGENTFORGE_RERANK_TIMEOUT_MS: ${AGENTFORGE_RERANK_TIMEOUT_MS:-6000}
      AGENTFORGE_SCAN_PROVIDER_MODE: ${AGENTFORGE_SCAN_PROVIDER_MODE:-local}
      AGENTFORGE_GEMINI_SCAN_MODEL: ${AGENTFORGE_GEMINI_SCAN_MODEL:-gemini-3.8-flash}
      AGENTFORGE_GEMINI_SCAN_TIMEOUT_MS: ${AGENTFORGE_GEMINI_SCAN_TIMEOUT_MS:-45000}
      AGENTFORGE_GEMINI_SCAN_DAILY_LIMIT: ${AGENTFORGE_GEMINI_SCAN_DAILY_LIMIT:-12}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENTFORGE_TRACE_PATH: /tmp/agentforge-w2-traces.json
      AGENTFORGE_PERSISTENCE_MODE: openemr-module
      AGENTFORGE_OPENEMR_MODULE_URL: http://openemr/interface/modules/custom_modules/oe-module-agentforge/public/api.php
      AGENTFORGE_OPENEMR_MODULE_TIMEOUT_MS: ${AGENTFORGE_OPENEMR_MODULE_TIMEOUT_MS:-15000}
      AGENTFORGE_MODULE_HMAC_SECRET: ${AGENTFORGE_MODULE_HMAC_SECRET:?AGENTFORGE_MODULE_HMAC_SECRET is required}
      AGENTFORGE_DEMO_WRITE_PATIENT_UUIDS: ${AGENTFORGE_DEMO_WRITE_PATIENT_UUIDS:?AGENTFORGE_DEMO_WRITE_PATIENT_UUIDS is required}
      # fixture-patient-NNN=<OpenEMR patient uuid>; every target must be allowlisted.
      AGENTFORGE_OPENEMR_DEMO_PATIENT_MAP: ${AGENTFORGE_OPENEMR_DEMO_PATIENT_MAP:?AGENTFORGE_OPENEMR_DEMO_PATIENT_MAP is required}
    expose:
      - "8788"
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8788/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # Patient dashboard port (docs/legacy-audit/MIGRATION-REACT.md §7): React SPA
  # + Fastify BFF holding a confidential OpenEMR OAuth client. Served at
  # /dashboard/ by Caddy. Not in proxy.depends_on on purpose: a failing
  # dashboard must not keep Caddy (and OpenEMR, AgentForge) from starting.
  dashboard:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: dashboard/Dockerfile
    environment:
      PORT: 8790
      NODE_ENV: production
      DASHBOARD_BASE_PATH: /dashboard
      DASHBOARD_PUBLIC_ORIGIN: ${DASHBOARD_PUBLIC_ORIGIN:?DASHBOARD_PUBLIC_ORIGIN is required}
      # OpenEMR's issuer exactly as its id tokens carry it: <site_addr_oath>/oauth2/default
      DASHBOARD_OAUTH_ISSUER: ${DASHBOARD_OAUTH_ISSUER:?DASHBOARD_OAUTH_ISSUER is required}
      DASHBOARD_OPENEMR_INTERNAL_URL: ${DASHBOARD_OPENEMR_INTERNAL_URL:-http://openemr}
      DASHBOARD_OAUTH_CLIENT_ID: ${DASHBOARD_OAUTH_CLIENT_ID:?DASHBOARD_OAUTH_CLIENT_ID is required}
      DASHBOARD_OAUTH_CLIENT_SECRET: ${DASHBOARD_OAUTH_CLIENT_SECRET:?DASHBOARD_OAUTH_CLIENT_SECRET is required}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?DASHBOARD_SESSION_SECRET is required}
      # Placeholder default; slice 01-02-01 confirms the timezone OpenEMR's NOW() runs in.
      DASHBOARD_OPENEMR_TZ: ${DASHBOARD_OPENEMR_TZ:-America/Chicago}
      DASHBOARD_DEMO_PATIENTS: ${DASHBOARD_DEMO_PATIENTS:-}
    expose:
      - "8790"
    depends_on:
      openemr:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8790/dashboard/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  proxy:
    restart: always
    image: caddy:2.9.1-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      openemr:
        condition: service_healthy
      agentforge:
        condition: service_healthy
      agentforge-w2:
        condition: service_healthy

volumes:
  logvolume01: {}
  sitevolume: {}
  databasevolume: {}
  caddy_data: {}
  caddy_config: {}
  tracevolume: {}

networks:
  agentforge-observability:
    name: agentforge-observability

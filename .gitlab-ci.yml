# AgentForge merge-request gate. GitHub workflows under .github/ do not run on
# GitLab; this file is the only CI gate that can block a merge request here.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - test
  - eval

# Same base image and OCR packages as the deployed Dockerfile, so tests and the
# gate exercise the Tesseract path that production runs.
.agentforge-node:
  image: node:24-alpine
  before_script:
    - apk add --no-cache poppler-utils tesseract-ocr tesseract-ocr-data-eng
    - npm ci --prefix agentforge

agentforge-tests:
  extends: .agentforge-node
  stage: test
  script:
    - npm test --prefix agentforge
    - npm test --prefix evals
    - node --test observability/test/*.test.js

# Mirrors the module PHP step of .githooks/pre-commit (always required here).
agentforge-module-php:
  image: php:8.4-cli-alpine
  stage: test
  script:
    - find interface/modules/custom_modules/oe-module-agentforge -name '*.php' -print0 | xargs -0 -n1 php -l
    - php interface/modules/custom_modules/oe-module-agentforge/tests/run.php

w2-regression-gate:
  extends: .agentforge-node
  stage: eval
  script:
    - npm run eval:gate --prefix agentforge

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - eval

w2-regression-gate:
  image: node:24
  stage: eval
  script:
    - npm run eval:gate --prefix agentforge

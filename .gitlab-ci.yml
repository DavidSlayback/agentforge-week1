# AgentForge merge-request gate. GitHub workflows under .github/ do not run on
# GitLab; this file is the only CI gate that can block a merge request here.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - test
  - eval

# Same base image and OCR packages as the deployed Dockerfile, so tests and the
# gate exercise the Tesseract path that production runs. AGENTFORGE_REQUIRE_OCR
# turns a missing OCR tool into a failure: the live-OCR tests
# (agentforge/test/helpers/ocrTools.js) never skip here. The pre-commit hook
# runs the same tests through agentforge/scripts/run-ocr-tests.sh. git is
# extra: test/gate-hooks.test.js checks the hooks' clean-tree rule with it.
.agentforge-node:
  image: node:24-alpine
  variables:
    AGENTFORGE_REQUIRE_OCR: "1"
  before_script:
    - apk add --no-cache poppler-utils tesseract-ocr tesseract-ocr-data-eng git
    - npm ci --prefix agentforge

# The hook's clean-tree check (.githooks/lib/gated-tree.sh) has no CI step: a
# CI checkout is always the committed tree.
agentforge-tests:
  extends: .agentforge-node
  stage: test
  script:
    - npm test --prefix agentforge
    - npm test --prefix evals
    - node --test observability/test/*.test.js

# Mirrors the module PHP step of .githooks/pre-commit (always required here).
agentforge-module-php:
  image: php:8.4-cli-alpine
  stage: test
  script:
    - find interface/modules/custom_modules/oe-module-agentforge -name '*.php' -print0 | xargs -0 -n1 php -l
    - php interface/modules/custom_modules/oe-module-agentforge/tests/run.php

w2-regression-gate:
  extends: .agentforge-node
  stage: eval
  script:
    - npm run eval:gate --prefix agentforge
    - npm run eval:extensions --prefix agentforge

# Mirrors the deploy.sh step of .githooks/pre-commit.
deploy-script:
  image: alpine:3.20
  stage: test
  script:
    - apk add --no-cache git coreutils
    - sh -n deploy/vultr/deploy.sh
    - sh deploy/vultr/test/deploy.test.sh

# Mirrors the dashboard step of .githooks/pre-commit.
dashboard-check:
  image: node:24-alpine
  stage: test
  script:
    - npm ci --prefix dashboard
    - npm run check --prefix dashboard
